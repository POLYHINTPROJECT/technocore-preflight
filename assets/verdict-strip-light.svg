<svg xmlns="http://www.w3.org/2000/svg" width="640" height="72" viewBox="0 0 640 72" role="img" aria-label="PFR v1 verdict statuses: PASS green, PARTIAL amber, FAIL red">
  <!-- J1 verdict strip - light theme -->
  <rect width="640" height="72" rx="8" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="71" rx="7.5" fill="none" stroke="#d0d7de"/>
  <text x="20" y="42" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="15" fill="#656d76">PFR v1 |</text>
  <!-- PASS -->
  <rect x="104" y="18" width="152" height="36" rx="6" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37"/>
  <circle cx="122" cy="36" r="5" fill="#1a7f37"/>
  <text x="136" y="41" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a7f37">PASS</text>
  <!-- PARTIAL -->
  <rect x="272" y="18" width="152" height="36" rx="6" fill="#9a6700" fill-opacity="0.08" stroke="#9a6700"/>
  <circle cx="290" cy="36" r="5" fill="#9a6700"/>
  <text x="304" y="41" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#9a6700">PARTIAL</text>
  <!-- FAIL -->
  <rect x="440" y="18" width="152" height="36" rx="6" fill="#cf222e" fill-opacity="0.08" stroke="#cf222e"/>
  <circle cx="458" cy="36" r="5" fill="#cf222e"/>
  <text x="472" y="41" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#cf222e">FAIL</text>
  <text x="620" y="42" text-anchor="end" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#656d76">engine=0.1.0</text>
</svg>
